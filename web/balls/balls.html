<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perspective Accurate Overlay - Flipped X</title>
<style>
    html, body {margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;}
    
    #bgVideo {
        position: absolute; top: 0; left: 0; 
        width: 100%; height: 100%; 
        object-fit: cover; 
        z-index: 1;
        /* FLIP X AXIS (Mirror effect) */
        transform: scaleX(-1);
    }

    #ballLayer {position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3;}

    .corner {
        position:absolute; width:30px; height:30px; 
        background:rgba(255,0,0,0.8); border:2px solid white; 
        border-radius:50%; transform:translate(-50%,-50%); 
        cursor:pointer; z-index:10;
    }
    .corner::before, .corner::after {
        content: ''; position: absolute; top: 50%; left: 50%;
        background: black; transform: translate(-50%, -50%);
    }
    .corner::before { width: 18px; height: 2px; }
    .corner::after { width: 2px; height: 18px; }

    .dot {
        position:absolute; 
        background: transparent; 
        border-style: solid; 
        border-color: red; 
        border-radius:50%; 
        transform:translate(-50%,-50%); 
        box-sizing: border-box;
    }

    #lockBtn {
        position: fixed; top: 20px; right: 20px; 
        padding: 10px 20px; z-index: 1000;
        background: rgba(0, 255, 0, 0.2); color: #fff;
        border: 2px solid #0f0; border-radius: 5px;
        cursor: pointer; font-family: sans-serif;
        backdrop-filter: blur(5px); transition: 0.3s;
    }
    #lockBtn:hover { background: rgba(0, 255, 0, 0.4); }
    #lockBtn.locked { border-color: #f00; background: rgba(255, 0, 0, 0.2); }
</style>
</head>
<body>

<button id="lockBtn">🔒 Lock Corners</button>
<video id="bgVideo" autoplay muted playsinline></video>

<div id="ballLayer"></div>
<div id="c0" class="corner"></div>
<div id="c1" class="corner"></div>
<div id="c2" class="corner"></div>
<div id="c3" class="corner"></div>

<script>
const HALF_WIDTH = 2.79/2, HALF_HEIGHT = 1.8/2;
const BALLS_LIST = [
  [[0, 0], [-0.165, 0.07], [-0.095, -0.43], [-0.635, -0.81], [-1.065, -0.53], [-1.255, -0.42], [0.165, -0.07], [0.095, 0.43], [0.635, 0.81], [1.065, 0.53], [1.255, 0.42]],
  [[0, 0], [-0.135, -0.17], [-0.395, 0.44], [-0.555, 0.58], [-0.835, 0.79], [-1.185, 0.56], [0.135, 0.17], [0.395, -0.44], [0.555, -0.58], [0.835, -0.79], [1.185, -0.56]],
  [[0, 0], [-0.085, -0.62], [-0.635, -0.26], [-0.135, 0.78], [-0.815, 0.81], [-1.155, 0.45], [0.085, 0.62], [0.635, 0.26], [0.135, -0.78], [0.815, -0.81], [1.155, -0.45]],
  [[0, 0], [-0.405, -0.2], [-0.575, -0.37], [-0.945, -0.79], [-0.785, 0.46], [-1.075, 0.54], [0.405, 0.2], [0.575, 0.37], [0.945, 0.79], [0.785, -0.46], [1.075, -0.54]]
];

let selectedLayout = BALLS_LIST[Math.floor(Math.random() * BALLS_LIST.length)]; 
const cornerElems = [c0,c1,c2,c3];

let isLocked = localStorage.getItem('cornersLocked') === 'true';
let corners = JSON.parse(localStorage.getItem('cornerPositions')) || [100,100, 500,100, 100,400, 500,400];

const lockBtn = document.getElementById('lockBtn');
const video = document.getElementById("bgVideo");

function updateLockUI() {
    lockBtn.innerText = isLocked ? "🔓 Unlock Corners" : "🔒 Lock Corners";
    lockBtn.classList.toggle('locked', isLocked);
    cornerElems.forEach(el => el.style.display = isLocked ? 'none' : 'block');
    localStorage.setItem('cornersLocked', isLocked);
    localStorage.setItem('cornerPositions', JSON.stringify(corners));
}

lockBtn.onclick = (e) => {
    e.stopPropagation();
    isLocked = !isLocked;
    updateLockUI();
};

function multmv(m,v){return [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]];}
function multmm(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let s=0;for(let k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s;}return c;}
function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]];}
function basisToPoints(x1,y1,x2,y2,x3,y3,x4,y4){const m=[x1,x2,x3, y1,y2,y3,1,1,1]; const v=multmv(adj(m),[x4,y4,1]); return multmm(m,[v[0],0,0,0,v[1],0,0,0,v[2]]);}
function general2DProjection(x1s,y1s,x1d,y1d,x2s,y2s,x2d,y2d,x3s,y3s,x3d,y3d,x4s,y4s,x4d,y4d){return multmm(basisToPoints(x1d,y1d,x2d,y2d,x3d,y3d,x4d,y4d),adj(basisToPoints(x1s,y1s,x2s,y2s,x3s,y3s,x4s,y4s)));}
function applyHomography(H,x,y){const r=multmv(H,[x,y,1]);return [r[0]/r[2], r[1]/r[2], r[2]];}

function render() {
    const H = general2DProjection(
        -HALF_WIDTH,  HALF_HEIGHT, corners[0], corners[1],
         HALF_WIDTH,  HALF_HEIGHT, corners[2], corners[3],
        -HALF_WIDTH, -HALF_HEIGHT, corners[4], corners[5],
         HALF_WIDTH, -HALF_HEIGHT, corners[6], corners[7]
    );

    let html = "";
    selectedLayout.forEach(([mx, my]) => {
        const [sx, sy, sz] = applyHomography(H, mx, my);
        const baseSize = 200; 
        const perspectiveSize = Math.max(30, baseSize / (sz * 0.4 + 0.6)); 
        const bWidth = Math.max(6, perspectiveSize / 12); 
        
        html += `<div class="dot" style="left:${sx}px; top:${sy}px; width:${perspectiveSize}px; height:${perspectiveSize}px; border-width:${bWidth}px;"></div>`;
    });
    
    document.getElementById("ballLayer").innerHTML = html;
    requestAnimationFrame(render);
}

function initCamera() {
    navigator.mediaDevices.getUserMedia({video: { width: 1920, height: 1080, facingMode: "environment" }})
    .then(s => {
        video.srcObject = s;
        render();
    })
    .catch(err => console.error("Camera error: ", err));
}

let active = -1;
window.onmousedown = e => {
    if(isLocked) return;
    active = -1; let dmin = 40;
    for(let i=0; i<4; i++) {
        let d = Math.hypot(e.pageX-corners[i*2], e.pageY-corners[i*2+1]);
        if(d < dmin) { active = i; dmin = d; }
    }
};
window.onmousemove = e => {
    if(!isLocked && active >= 0) {
        corners[active*2] = e.pageX; corners[active*2+1] = e.pageY;
        cornerElems[active].style.left = e.pageX+'px';
        cornerElems[active].style.top = e.pageY+'px';
        localStorage.setItem('cornerPositions', JSON.stringify(corners));
    }
};
window.onmouseup = () => active = -1;

cornerElems.forEach((el, i) => {
    el.style.left = corners[i*2]+'px'; 
    el.style.top = corners[i*2+1]+'px';
});
updateLockUI();
initCamera();

</script>
</body>
</html>
